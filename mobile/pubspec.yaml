name: hospital_p2tb_mobile
description: "Ứng dụng Flutter Hospital P2TB hợp nhất toàn bộ giao diện Cao Thiên với Cognito và AWS API."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.9.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  amplify_flutter: ^2.11.0
  amplify_auth_cognito: ^2.11.0

  provider: ^6.1.5+1
  go_router: ^17.2.3
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^11.0.0
  intl: ^0.20.2
  socket_io_client: ^2.0.3+1
  http: ^1.5.0
  jwt_decode: ^0.3.1
  json_annotation: ^4.9.0
  path: ^1.9.1
  image_picker: ^1.2.1
  cross_file: ^0.3.5+1
  dio: ^5.9.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.1
  json_serializable: ^6.11.1

flutter:
  uses-material-design: true
  generate: true
